<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <div id="personasAdmin"></div>
    <div class="cubo1" id="cubo1"></div>
    </div>

           <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.13.0/lottie.min.js"></script>
    <script>

        const personas = lottie.loadAnimation({
            container: document.getElementById('personasAdmin'),
            renderer: 'svg',
            loop: false,
            autoplay: false,
            path: "assets/personasAnim.json"
        });

        document.getElementById('cubo1').addEventListener("click", function(){
            personas.stop();
            personas.play();
        })
            
            


    </script>
</body>
</html>
